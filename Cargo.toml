[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "HolyC compiler, TempleOS compatibility layer, and Sanctum graphical host"

[workspace.dependencies]
cranelift-codegen = "0.134"
cranelift-frontend = "0.134"
cranelift-module = "0.134"
cranelift-jit = "0.134"
cranelift-native = "0.134"
cranelift-object = "0.134"
target-lexicon = "0.13"
thiserror = "2"
minifb = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
directories = "6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
slint = "1.17.1"
slint-build = "1.17.1"
lucide-slint = "1.42.0"
rfd = "0.17.2"
cpal = "0.18.2"
